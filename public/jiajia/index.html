<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Editor + AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-glass-dark: rgba(15, 23, 42, 0.95);
            --bg-light: rgba(255, 255, 255, 0.98);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 10px 30px -5px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0f0f0f;
        }

        .page-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: #0f0f0f;
        }

        .page-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            background: url('/jiajia/public/底图.png') top left no-repeat;
            background-size: 1920px 1080px;
            transform-origin: top left;
        }

        .title-input, .body-input {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 17px;
            font-family: inherit;
            color: #1a1a1a;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .title-input {
            top: 25%;
            left: 51.0417%;
            width: 28.125%;
            height: 3.7037%;
        }

        .body-input {
            top: 38.8889%;
            left: 51.0417%;
            width: 28.125%;
            height: 24.537%;
            resize: none;
            line-height: 1.5;
        }

        .ai-warning {
            position: absolute;
            top: calc(38.8889% + 24.537% + 8px);
            left: 51.0417%;
            font-size: 13px;
            color: #eab308;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .ai-warning.show {
            opacity: 1;
        }

        .title-input::placeholder, .body-input::placeholder {
            color: #9ca3af;
        }

        .title-input:focus, .body-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15), 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        /* AI Assistant FAB */
        .ai-fab {
            position: fixed;
            bottom: 280px;
            right: 32px;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            border: none;
            cursor: grab;
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.4);
            transition: box-shadow 0.2s, transform 0.1s;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            user-select: none;
        }

        .ai-fab::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid rgba(249, 115, 22, 0.5);
            animation: fabPulse 1.8s ease-out infinite;
            pointer-events: none;
        }

        @keyframes fabPulse {
            0% {
                transform: scale(0.96);
                opacity: 0.85;
            }
            100% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        .ai-fab-tag {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
            pointer-events: none;
            z-index: 1;
        }

        .ai-fab:active {
            cursor: grabbing;
            transform: scale(1.05);
        }

        .ai-fab:hover {
            box-shadow: 0 14px 36px rgba(249, 115, 22, 0.5);
        }

        /* AI Chat Panel */
        .ai-panel {
            position: fixed;
            bottom: 110px;
            right: 32px;
            width: 420px;
            height: 580px;
            background: var(--bg-light);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.08);
            z-index: 999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ai-panel.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .panel-header img {
            width: 36px;
            height: 36px;
            border-radius: 10px;
        }

        .panel-header-title {
            flex: 1;
        }

        .panel-header-title h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .panel-header-title span {
            font-size: 12px;
            color: rgba(0,0,0,0.5);
        }

        .close-panel {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(0,0,0,0.06);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0,0,0,0.6);
            transition: all 0.2s;
        }

        .close-panel:hover {
            background: rgba(0,0,0,0.1);
            color: #000;
        }

        .lang-toggle {
            height: 32px;
            min-width: 52px;
            padding: 0 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.06);
            border: none;
            cursor: pointer;
            color: rgba(0,0,0,0.75);
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .lang-toggle:hover {
            background: rgba(0,0,0,0.1);
            color: #000;
        }

        .system-prompt-area {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-height: 0;
            opacity: 0;
            padding: 0 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .system-prompt-area.show {
            opacity: 1;
            max-height: 60px;
            padding: 12px 16px;
        }

        .system-prompt {
            font-size: 13px;
            color: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .generate-btn-small {
            padding: 8px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .generate-btn-small:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .system-prompt::before {
            content: '🔍';
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 3px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: messageIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-label.translation { color: #8b5cf6; }
        .message-label.polish { color: #f59e0b; }
        .message-label.format { color: #10b981; }
        .message-label.generated { color: #3b82f6; }

        .push-cards {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .push-card {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            padding: 16px;
            transition: all 0.2s;
        }

        .push-card:hover {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.12);
        }

        .push-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .push-card-body {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.6);
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .field-label {
            color: #f97316;
            font-weight: 700;
            font-size: 13px;
            margin-right: 4px;
        }

        .apply-btn {
            flex: 1;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .apply-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .apply-btn:active {
            transform: translateY(0);
        }

        .card-buttons {
            display: flex;
            gap: 8px;
        }

        .add-to-chat-btn {
            flex: 1;
            padding: 10px 16px;
            background: #fff;
            border: 1px solid var(--primary);
            border-radius: 10px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .add-to-chat-btn:hover {
            background: rgba(37, 99, 235, 0.08);
            border-color: var(--primary);
        }

        .refresh-btn {
            align-self: flex-start;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            color: rgba(0, 0, 0, 0.75);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .refresh-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.15);
        }

        .refresh-btn svg {
            width: 16px;
            height: 16px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(0,0,0,0.5);
            font-size: 13px;
            padding: 16px 0;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.15);
            border-top-color: var(--primary-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-input-wrapper {
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 14px;
            color: #1a1a1a;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            transition: all 0.2s;
        }

        .chat-input::placeholder {
            color: rgba(0,0,0,0.35);
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.04);
        }

        .send-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: all 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .send-btn.stop-mode {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .send-btn.stop-mode:hover {
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.45);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        .send-btn .send-icon-stop {
            display: none;
        }

        .send-btn.stop-mode .send-icon-send {
            display: none;
        }

        .send-btn.stop-mode .send-icon-stop {
            display: block;
        }

        .ai-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            position: relative;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            color: rgba(0, 0, 0, 0.75);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .action-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.15);
            color: #000;
        }

        .action-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
        }

        .dropdown {
            position: absolute;
            bottom: 100%;
            left: 0;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 8px;
            min-width: 200px;
            box-shadow: var(--shadow-lg);
            display: none;
            z-index: 10;
            white-space: nowrap;
        }

        .dropdown.show {
            display: block;
            animation: dropdownIn 0.2s ease;
        }

        @keyframes dropdownIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-item {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.75);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dropdown-item:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #000;
        }

        .dropdown-item.selected {
            background: var(--primary);
            color: #fff;
        }

        /* 语言标签：默认黑色，选中时白色 */
        .dropdown-item .lang-label {
            font-weight: 700;
            color: #000;
            text-decoration: underline;
        }

        .dropdown-item.selected .lang-label {
            color: #fff;
        }

        .dropdown-item .check {
            width: 14px;
            height: 14px;
            opacity: 0;
        }

        .dropdown-item.selected .check {
            opacity: 1;
        }

        .initial-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px;
        }

        .confirm-btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
            font-family: inherit;
        }

        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
        }

        .confirm-btn:active {
            transform: translateY(0);
        }

        .hint-text {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-align: center;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(0,0,0,0.35);
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 24px;
            background: #fff;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            color: #1a1a1a;
            font-size: 14px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
        }

        .toast::before {
            content: '✓';
            width: 24px;
            height: 24px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-wrapper" id="pageWrapper">
            <div class="editor-overlay">
                <input type="text" class="title-input" placeholder="Please enter" id="titleInput">
                <textarea class="body-input" placeholder="Text can contain up to 400 characters" id="bodyInput"></textarea>
                <div class="ai-warning" id="aiWarning">⚠️ Parts of this push copy were generated by AI. Please review carefully and confirm.</div>
            </div>
        </div>
    </div>

    <button class="ai-fab" id="aiFab" aria-label="打开AI助手">
        <span class="ai-fab-tag">AI</span>
    </button>

    <div class="ai-panel" id="aiPanel">
        <div class="panel-header">
            <div class="panel-header-title">
                <h3 id="panelTitle">AI Marketing Assistance</h3>
            </div>
            <button class="lang-toggle" id="langToggle" type="button">EN</button>
            <button class="close-panel" id="closePanel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="system-prompt-area" id="systemPromptArea">
            <div class="system-prompt" id="systemPromptText">
                识别到前面有滴滴券节点，AI生成 Push
            </div>
            <button class="generate-btn-small" id="generateBtn">确定</button>
        </div>

        <div class="chat-messages" id="chatMessages">
        </div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea class="chat-input" id="chatInput" placeholder="输入 Push 文案..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path class="send-icon-send" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        <rect class="send-icon-stop" x="7" y="7" width="10" height="10" rx="1"/>
                    </svg>
                </button>
            </div>
            <div class="ai-actions">
                <div class="action-btn" id="translateBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span id="translateBtnText">智能翻译</span>
                    <div class="dropdown" id="translateDropdown">
                        <div class="dropdown-item selected" data-value="auto">
                            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            <span id="translateAutoPrefix">自动识别：</span><span class="lang-label" id="translateAutoLang">西班牙语</span>
                        </div>
                        <div class="dropdown-item" data-value="en">
                            <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <path d="M20 6L9 17l-5-5"/>
                            </svg>
                            <span id="translateOptEn">英语</span>
                        </div>
                        <div class="dropdown-item" data-value="pt">

        async function requestAiCopy(type, value, inputText, signal) {
            const resp = await fetch('/api/ai-assistant', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                signal,
                body: JSON.stringify({ type, value, inputText })
            });

            const payload = await resp.json();
            if (!resp.ok || payload?.status !== 'success') {
                const errMsg = payload?.message || 'AI 请求失败';
                throw new Error(errMsg);
            }

            return payload;
        }

            sendBtn.setAttribute('aria-label', generating ? t('stopAria') : t('sendAria'));
            sendBtn.title = generating ? t('stopTitle') : t('sendTitle');

        async function processFreePrompt(inputText) {
            if (!inputText) return;
            if (isGenerating) {
                showToast(t('toastRunning'));
                return;
            }

            appendUserMessage(t('msgUserInput'), inputText);
            const controller = new AbortController();
            currentAbortController = controller;
            setGeneratingState(true);
            const loading = appendLoading();

            try {
                const resp = await fetch('/api/ai-assistant', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal,
                    body: JSON.stringify({ type: 'chat', value: 'default', inputText })
                });

                const payload = await resp.json();
                if (!resp.ok || payload?.status !== 'success') {
                    throw new Error(payload?.message || 'AI 请求失败');
                }

                const mode = payload?.data?.mode;
                if (mode === 'push') {
                    const result = {
                        title: payload?.data?.title || '',
                        body: payload?.data?.body || ''
                    };
                    chatMessages.insertAdjacentHTML('beforeend', createPushCards([result], t('labelGenerated'), 'generated', false));
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    const reply = payload?.data?.reply || t('fallbackReply');
                    appendAssistantMessage(reply);
                }
            } catch (error) {
                if (error?.name === 'AbortError') {
                    showToast(t('toastPaused'));
                } else {
                    showToast(t('toastFailed') + (error?.message || 'Please retry later'));
                }
            } finally {
                loading.remove();
                if (currentAbortController === controller) {
                    currentAbortController = null;
                }
                setGeneratingState(false);
            }
        }

            title = title.replace(/^title:\s*/i, '').replace(/^title：\s*/i, '');

                    }
                }

                const controller = new AbortController();
                currentAbortController = controller;
                setGeneratingState(true);
                const loading = appendLoading();

                try {
                    if (regenContext?.type && regenContext?.inputText) {
                        const payload = await requestAiCopy(regenContext.type, regenContext.value, regenContext.inputText, controller.signal);
                        const nextData = [{
                            title: payload?.data?.title || '',
                            body: payload?.data?.body || ''
                        }];
                        messageEl.outerHTML = createPushCards(nextData, regenContext.label || t('labelGenerated'), regenContext.labelClass || 'generated', true, regenContext);
                    } else {
                        variantToggle = (variantToggle + 1) % refreshVariants.length;
                        const nextData = refreshVariants[variantToggle];
                        messageEl.outerHTML = createPushCards(nextData, t('labelGenerated'), 'generated', true);
                    }
                } catch (error) {
                    if (error?.name === 'AbortError') {
                        showToast(t('toastPaused'));
                    } else {
                        showToast(t('toastFailed') + (error?.message || 'Please retry later'));
                    }
                } finally {
                    loading.remove();
                    if (currentAbortController === controller) {
                        currentAbortController = null;
                    }
                    setGeneratingState(false);
                }
            }
        });

        translateBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            translateDropdown.classList.toggle('show');
            polishDropdown.classList.remove('show');
        });

        polishBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            polishDropdown.classList.toggle('show');
            translateDropdown.classList.remove('show');
        });

        document.querySelectorAll('#translateDropdown .dropdown-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('#translateDropdown .dropdown-item').forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
                currentTranslate = item.dataset.value;
                translateDropdown.classList.remove('show');
                
                let inputText = chatInput.value.trim();
                if (!inputText) {
                    showToast(t('toastNeedInput'));
                    return;
                }
                processWithAI('translate', currentTranslate, inputText);
            });
        });

        document.querySelectorAll('#polishDropdown .dropdown-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('#polishDropdown .dropdown-item').forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
                currentPolish = item.dataset.value;
                polishDropdown.classList.remove('show');
                
                let inputText = chatInput.value.trim();
                if (!inputText) {
                    showToast(t('toastNeedInput'));
                    return;
                }
                processWithAI('polish', currentPolish, inputText);
            });
        });

        formatBtn.addEventListener('click', () => {
            translateDropdown.classList.remove('show');
            polishDropdown.classList.remove('show');
            
            let inputText = chatInput.value.trim();
            if (!inputText) {
                showToast(t('toastNeedInput'));
                return;
            }
            processWithAI('format', 'default', inputText);
        });

        async function processWithAI(type, value, inputText) {
            if (!inputText) return;
            if (isGenerating) {
                showToast(t('toastRunning'));
                return;
            }

            let funcName = '';
            if (type === 'translate') {
                const langNames = currentLang === 'en'
                    ? { 'en': 'English', 'pt': 'Portuguese', 'fr': 'French', 'auto': 'Spanish' }
                    : { 'en': '英语', 'pt': '葡萄牙语', 'fr': '法语', 'auto': '西班牙语' };
                funcName = t('actionTranslate') + (value === 'auto' ? t('actionTranslateAuto') : langNames[value] || '');
            } else if (type === 'polish') {
                const polishNames = currentLang === 'en'
                    ? { 'balanced': 'Balanced', 'rich': 'More Expressive', 'concise': 'More Concise', 'casual': 'More Casual', 'emoji': 'Add Emoji' }
                    : { 'balanced': '均衡润色', 'rich': '更丰富', 'concise': '更简明', 'casual': '更轻松', 'emoji': '加表情' };
                funcName = t('actionPolish') + (polishNames[value] || '');
            } else if (type === 'format') {
                funcName = t('actionFormat');
            }

            appendUserMessage(funcName, inputText);
            chatInput.value = '';
            chatInput.style.height = 'auto';

            const controller = new AbortController();
            currentAbortController = controller;
            setGeneratingState(true);
            const loading = appendLoading();

            try {
                const payload = await requestAiCopy(type, value, inputText, controller.signal);

                const result = {
                    title: payload?.data?.title || '',
                    body: payload?.data?.body || ''
                };

                let label = t('labelGenerated');
                let labelClass = 'generated';

                if (type === 'translate') {
                    label = t('labelTranslate');
                    labelClass = 'translation';
                } else if (type === 'polish') {
                    label = t('labelPolish');
                    labelClass = 'polish';
                } else if (type === 'format') {
                    label = t('labelFormat');
                    labelClass = 'format';
                }

                const regenContext = { type, value, inputText, label, labelClass };
                const messageDiv = document.createElement('div');
                messageDiv.innerHTML = createPushCards([result], label, labelClass, true, regenContext);
                chatMessages.appendChild(messageDiv);
                hasGenerated = true;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                if (error?.name === 'AbortError') {
                    showToast(t('toastPaused'));
                } else {
                    showToast(t('toastFailed') + (error?.message || 'Please retry later'));
                }
            } finally {
                loading.remove();
                if (currentAbortController === controller) {
                    currentAbortController = null;
                }
                setGeneratingState(false);
            }
        }

        document.addEventListener('click', (e) => {
            if (!translateBtn.contains(e.target) && !translateDropdown.contains(e.target)) {
                translateDropdown.classList.remove('show');
            }
            if (!polishBtn.contains(e.target) && !polishDropdown.contains(e.target)) {
                polishDropdown.classList.remove('show');
            }
        });

        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        chatMessages.addEventListener('click', function(e) {
            const addBtn = e.target.closest('.add-to-chat-btn');
            if (addBtn) {
                const idx = parseInt(addBtn.dataset.idx);
                const item = currentPushData[idx];
                if (item) {
                    addToChatbox(item.title, item.body);
                }
            }
        });

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const text = this.value.trim();
                if (text) {
                    processFreePrompt(text);
                    this.value = '';
                    this.style.height = 'auto';
                }
            }
        });

        const sendBtn = document.getElementById('sendBtn');
        sendBtn.addEventListener('click', () => {
            if (isGenerating && currentAbortController) {
                currentAbortController.abort();
                return;
            }

            const text = chatInput.value.trim();
            if (text) {
                processFreePrompt(text);
                chatInput.value = '';
                chatInput.style.height = 'auto';
            }
        });

        langToggle.addEventListener('click', () => {
            applyLanguage(currentLang === 'zh' ? 'en' : 'zh');
        });

        applyLanguage('en');

        function initScale() {
            const scale = Math.min(window.innerWidth / 1920, 1);
            const wrapper = document.getElementById('pageWrapper');
            if (wrapper) {
                wrapper.style.transform = `scale(${scale})`;
            }
        }
        
        window.addEventListener('load', initScale);
        window.addEventListener('resize', initScale);

        bodyInput.addEventListener('input', function() {
            const aiWarning = document.getElementById('aiWarning');
            aiWarning.classList.remove('show');
        });
    </script>
</body>
</html>
